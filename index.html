<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<title>Aurora Conifer · 粒子圣诞树</title>
<meta name="description" content="一棵由数千枚发光粒子构成的圣诞树：自由视角、粒子拖尾、短促炫目的闪烁、指尖避让。" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&display=swap" rel="stylesheet" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23050b12'/%3E%3Cpath d='M16 5l2.9 6.6 7.1.7-5.4 4.8 1.6 7-6.2-3.8-6.2 3.8 1.6-7L6 12.3l7.1-.7z' fill='%23ffe08a'/%3E%3C/svg%3E" />
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#03060a;overflow:hidden}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  #scene{
    position:fixed;inset:0;display:block;width:100%;height:100%;
    cursor:grab;touch-action:none;
  }
  #scene.dragging{cursor:grabbing}

  .overlay{
    position:fixed;inset:0;pointer-events:none;
    display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
    padding-bottom:clamp(26px,7vh,78px);
    gap:clamp(10px,1.7vh,16px);
    background:linear-gradient(to top, rgba(3,6,10,.92) 0%, rgba(3,6,10,.62) 6%, rgba(3,6,10,0) 27%);
  }
  .rule{
    width:clamp(64px,9vw,124px);height:1px;
    background:linear-gradient(90deg,rgba(255,214,140,0),rgba(255,214,140,.55),rgba(255,214,140,0));
    opacity:0;
    animation:rise 2.2s .95s cubic-bezier(.22,.61,.36,1) forwards;
  }
  .title{
    font-family:"Cormorant Garamond","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    font-weight:500;
    font-size:clamp(12px,1.5vw,19px);
    letter-spacing:.64em;text-indent:.64em;
    color:#eaf7ef;
    opacity:0;
    text-shadow:0 0 22px rgba(122,255,190,.42),0 0 64px rgba(255,206,120,.20);
    animation:rise 2.6s 1.15s cubic-bezier(.22,.61,.36,1) forwards;
  }
  .hint{
    font-size:clamp(9px,.72vw,10.5px);
    letter-spacing:.30em;text-indent:.30em;
    color:rgba(210,236,226,.34);
    opacity:0;
    animation:rise 2.6s 2.05s cubic-bezier(.22,.61,.36,1) forwards;
  }
  @keyframes rise{
    from{opacity:0;transform:translateY(12px)}
    to{opacity:1;transform:translateY(0)}
  }
  @media (prefers-reduced-motion: reduce){
    .title,.hint{animation-duration:.01s;animation-delay:0s}
  }
</style>
</head>
<body>
<canvas id="scene" aria-label="粒子圣诞树"></canvas>
<div class="overlay">
  <div class="rule"></div>
  <div class="title">MERRY CHRISTMAS</div>
  <div class="hint">拖动旋转 · 滚轮缩放 · 触碰驱散</div>
</div>

<script>
(() => {
  'use strict';

  /* ───────────────────────────── 数学工具 ───────────────────────────── */
  const TAU = Math.PI * 2;
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, t) => a + (b - a) * t;
  const easeOut = (t) => 1 - Math.pow(1 - t, 3);

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  let rnd = mulberry32(0xc0ffee);
  const rr = (a, b) => a + (b - a) * rnd();
  const gauss = () => {
    let u = 0, v = 0;
    while (u === 0) u = rnd();
    while (v === 0) v = rnd();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * v);
  };

  /* ───────────────────────────── 配色与光斑贴图 ───────────────────────────── */
  const COL = {
    deep:  [ 24, 126,  84],
    jade:  [ 62, 212, 148],
    mint:  [160, 255, 210],
    gold:  [255, 170,  58],
    white: [255, 248, 220],
    ice:   [146, 212, 255],
    red:   [255,  92,  84],
  };

  const spriteCache = new Map();
  function glow(rgb, core, size) {
    const key = rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',' + core + ',' + size;
    let c = spriteCache.get(key);
    if (c) return c;
    c = document.createElement('canvas');
    c.width = c.height = size;
    const g = c.getContext('2d');
    const r = size / 2;
    const grd = g.createRadialGradient(r, r, 0, r, r, r);
    const s = rgb.join(',');
    grd.addColorStop(0.00, 'rgba(255,255,255,' + core + ')');
    grd.addColorStop(0.15, 'rgba(' + s + ',0.94)');
    grd.addColorStop(0.40, 'rgba(' + s + ',0.34)');
    grd.addColorStop(0.70, 'rgba(' + s + ',0.085)');
    grd.addColorStop(1.00, 'rgba(' + s + ',0)');
    g.fillStyle = grd;
    g.fillRect(0, 0, size, size);
    spriteCache.set(key, c);
    return c;
  }
  const SPR = {};
  for (const k in COL) SPR[k] = glow(COL[k], 0.92, 64);
  // 闪烁专用的高亮核：白得刺眼，是"晃眼"的来源
  const SPR_HOT = glow([255, 246, 214], 1, 64);

  /* ───────────────────────────── 全局状态 ───────────────────────────── */
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d', { alpha: false });

  // 拖尾层：树体先画进这里，每帧按比例"抹淡"再叠回主画布
  const trailCv = document.createElement('canvas');
  const tctx = trailCv.getContext('2d');

  const bloomA = document.createElement('canvas');
  const bA = bloomA.getContext('2d');
  const bloomB = document.createElement('canvas');
  const bB = bloomB.getContext('2d');
  const bgCanvas = document.createElement('canvas');
  const bgCtx = bgCanvas.getContext('2d');

  const MOTION = window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 0.32 : 1;

  const CFG = {
    camDist: 3.15,
    camMin: 2.30,
    camMax: 4.80,
    baseY: -0.56,
    treeH: 1.12,
    baseR: 0.48,
    turns: 4.2,
    tiers: 10,
    revealDur: 1.9,
    // 视角
    dragYaw: 0.0055,
    dragPitch: 0.0042,
    pitchMin: -0.30,
    pitchMax: 0.55,
    idleSpin: 2.9,        // 停止操作多少秒后，自转缓慢接回来
    spin: 0.085,
    // 碰触避让
    pushR: 138,           // 影响半径（px）
    pushForce: 3400,      // 推力基准（px/s²）
    // 闪烁
    flashRate: 26,        // 峰值：每秒新生闪烁数
    flashDelay: 1.05,     // 松手后多久恢复闪烁
    flashRamp: 1.7,       // 恢复所用的缓入时长
    // 拖尾
    trailBase: 0.255,     // 每 1/60 秒抹淡的比例
  };

  let DPR = Math.min(window.devicePixelRatio || 1, 2);
  let W = 1, H = 1, CX = 0, CY = 0, K = 500;
  let vignette = null;

  const state = {
    t: 0,
    elapsed: 0,
    yaw: 0,
    pitch: 0.10,
    vyaw: 0,
    vpitch: 0,
    dist: CFG.camDist,
    distTarget: CFG.camDist,
    burst: 0,
    idle: 99,
    spinW: 1,
  };

  const pointer = {
    x: -9999,
    y: -9999,
    down: false,
    active: false,
    idle: 99,
  };

  const flash = {
    budget: 0,
    on: true,
    allow: true,          // 触碰期间关闭
    sinceUp: 99,
    list: [],             // 本帧有闪烁的粒子
    live: 0,              // 当前活跃闪烁数
    total: 0,             // 累计触发次数（调试用）
  };

  let particles = [];
  let lightPool = [];     // 灯/挂饰索引池，闪烁优先照顾它们
  let droplets = [];
  let garland = [];
  let bgStars = [];
  let twinkles = [];

  let cyaw = 1, syaw = 0, cpitch = 1, spitch = 0;

  const quality = { level: 2 };
  let NO_GRADE = false;

  // 层裙：tier 内向外鼓出，但在层界连续（原公式在层界硬切，俯瞰会露出同心圆环）
  function tierProfile(u) {
    const tf = (u * CFG.tiers) % 1;
    const bell = Math.sin(Math.PI * tf);
    return (0.84 + 0.24 * Math.pow(bell, 0.8)) * (0.87 + 0.13 * clamp(u / 0.1, 0, 1));
  }

  /* ───────────────────────────── 建树 ───────────────────────────── */
  function buildTree() {
    rnd = mulberry32(0xc0ffee);

    const area = window.innerWidth * window.innerHeight;
    const N = Math.round(clamp(area / 205, 2400, 5600));

    const P = [];
    for (let i = 0; i < N; i++) {
      // 目标：锥面面积加权采样 —— 底部更密，符合"更多质量"的观感
      const u = 1 - Math.pow(rnd(), 0.62);
      let y0 = CFG.baseY + u * CFG.treeH;
      const prof = Math.pow(1 - u, 0.92);
      let R = CFG.baseR * prof;

      // 分层裙边：每个 tier 内向外鼓出，形成冷杉的层叠轮廓
      const tf = (u * CFG.tiers) % 1;
      R *= tierProfile(u);

      // 打破"平盘"感：层缘下垂、全身加一点纵向抖动
      y0 += gauss() * 0.006 + (tf > 0.55 ? (tf - 0.55) * 0.018 * rnd() : 0);

      const shell = rnd() < 0.86;
      const rad = (shell ? R * (0.94 + 0.075 * rnd()) : R * Math.pow(rnd(), 0.45) * 0.92) * (1 + gauss() * 0.022);

      // 20% 的粒子落在螺旋花环上，让"缠绕的灯带"可被看见
      const onHelix = rnd() < 0.20;
      const a0 = onHelix ? u * CFG.turns * TAU + gauss() * 0.11 : rnd() * TAU;

      // 颜色：深绿为主，玉色为辅，少量金/红/冷白做点缀；越靠树梢越暖
      const r = rnd();
      const warmTop = u > 0.58 ? 0.10 : 0;
      let kind;
      if (r < 0.070 + warmTop) kind = 'gold';
      else if (r < 0.190 + warmTop) kind = 'mint';
      else if (r < 0.310 + warmTop) kind = 'white';
      else if (r < 0.690) kind = 'jade';
      else kind = 'deep';

      // 越靠近树梢，越偏亮色 —— 自然的受光梯度
      if (kind === 'deep' && u > 0.72 && rnd() < 0.4) kind = 'jade';

      const sizeBase = shell ? 4.2 + 5.0 * rnd() : 3.4 + 4.0 * rnd();

      // 灯与树叶的"体质"差异（刻意做得很轻微）：
      //   灯  —— 轻、行程长、回弹有余震、闪得频；树叶 —— 沉、行程短、落地即止、几乎只余微光
      const light = onHelix;
      P.push({
        type: 'tree',
        y0,
        r: rad,
        a0,
        sz: sizeBase * (u < 0.12 ? 0.85 : 1),
        kind,
        base: (shell ? 0.62 : 0.27) * (onHelix ? 0.82 : 1),
        ph: rnd() * TAU,
        fq: rr(0.7, 2.4),
        wob: rr(0.006, 0.03),
        spd: rr(-0.05, 0.05),
        bokeh: shell ? 1 : 1.15,
        // 物理体质
        light,
        mass: light ? 1 : 1.55,           // 越重越"钝"
        k: light ? 82 : 46,               // 回位刚度
        damp: light ? 7.0 : 13.0,         // 阻尼（树叶一沉到底）
        stroke: light ? 1.90 : 0.86,      // 行程
        pushR: light ? 1.16 : 0.94,
        swirl: light ? 0.30 : 0.10,       // 被拨开时的绕行感
        flashW: light ? 3.0 : 0.42,       // 闪烁权重
        // 累积位移（屏幕空间，px）
        fpx: 0, fpy: 0, fvx: 0, fvy: 0, moving: false,
        // 缓存的投影结果，供闪烁层复用
        px: 0, py: 0, psz: 0, pa: 0, vis: false, pvx: 0, pvy: 0,
        // 闪烁
        fl: 0, fls: 0, flDur: 0.12, flPow: 1,
        // 汇聚动画的起始位置：一团散开的星尘
        sx0: gauss() * 1.15,
        sy0: gauss() * 0.95,
        sz0: gauss() * 1.15,
        delay: rnd() * 1.05,
        // 绽开的位移与速度（世界空间）
        ox: 0, oy: 0, oz: 0,
        vx: 0, vy: 0, vz: 0,
      });
    }

    // 树梢簇：让顶点不至于过细
    for (let i = 0; i < 110; i++) {
      const u = 0.955 + rnd() * 0.045;
      const y0 = CFG.baseY + u * CFG.treeH;
      P.push({
        type: 'tree',
        y0,
        r: 0.035 * Math.pow(rnd(), 0.6),
        a0: rnd() * TAU,
        sz: 3.2 + 3.0 * rnd(),
        kind: rnd() < 0.55 ? 'mint' : 'white',
        base: 0.62,
        ph: rnd() * TAU,
        fq: rr(1.2, 3.0),
        wob: rr(0.01, 0.04),
        spd: rr(-0.06, 0.06),
        bokeh: 1,
        light: true,
        mass: 1,
        k: 88, damp: 6.6, stroke: 2.1, pushR: 1.15, swirl: 0.34,
        flashW: 2.4,
        fpx: 0, fpy: 0, fvx: 0, fvy: 0, moving: false,
        px: 0, py: 0, psz: 0, pa: 0, vis: false, pvx: 0, pvy: 0,
        fl: 0, fls: 0, flDur: 0.12, flPow: 1,
        sx0: gauss() * 0.8, sy0: 1.2 + gauss() * 0.4, sz0: gauss() * 0.8,
        delay: 0.5 + rnd() * 0.7,
        ox: 0, oy: 0, oz: 0, vx: 0, vy: 0, vz: 0,
      });
    }

    // 挂饰：大颗、强脉动的彩色灯球
    const orn = 118;
    for (let i = 0; i < orn; i++) {
      const u = Math.pow(rnd(), 0.85) * 0.93;
      const y0 = CFG.baseY + u * CFG.treeH;
      const prof = Math.pow(1 - u, 0.92);
      let R = CFG.baseR * prof;
      R *= tierProfile(u);
      const ang = u * CFG.turns * TAU + (rnd() - 0.5) * 0.25;
      const roll = rnd();
      const kind = roll < 0.46 ? 'gold' : roll < 0.72 ? 'white' : roll < 0.88 ? 'mint' : 'red';
      P.push({
        type: 'orn',
        y0,
        r: R * 1.02,
        a0: ang,
        sz: 9 + 8 * rnd(),
        kind,
        base: 0.95,
        ph: rnd() * TAU,
        fq: rr(0.9, 2.2),
        wob: rr(0.004, 0.012),
        spd: rr(-0.04, 0.04),
        bokeh: 0.92,
        light: true,
        mass: 1.1,
        k: 70, damp: 8.4, stroke: 1.65, pushR: 1.22, swirl: 0.26,
        flashW: 3.4,
        fpx: 0, fpy: 0, fvx: 0, fvy: 0, moving: false,
        px: 0, py: 0, psz: 0, pa: 0, vis: false, pvx: 0, pvy: 0,
        fl: 0, fls: 0, flDur: 0.12, flPow: 1,
        sx0: gauss() * 1.2, sy0: gauss() * 1.0, sz0: gauss() * 1.2,
        delay: 0.3 + rnd() * 0.9,
        ox: 0, oy: 0, oz: 0, vx: 0, vy: 0, vz: 0,
      });
    }

    particles = P;
    lightPool = [];
    for (let i = 0; i < P.length; i++) if (P[i].light) lightPool.push(P[i]);

    // 花环灯：沿螺旋持续上行，是最显眼的"动态"
    garland = [];
    const GN = 74;
    for (let i = 0; i < GN; i++) {
      garland.push({
        off: i / GN,
        speed: rr(0.020, 0.030),
        ph: rnd() * TAU,
        kind: rnd() < 0.55 ? 'gold' : 'white',
        sz: rr(7, 13),
        px: 0, py: 0, ox: 0, oy: 0,
      });
    }

    // 雪
    droplets = [];
    const SN = Math.round(clamp(area / 2100, 200, 620));
    for (let i = 0; i < SN; i++) {
      droplets.push({
        x: rr(-1.05, 1.05),
        y: rr(-0.62, 0.98),
        z: rr(-1.05, 1.05),
        vy: rr(0.035, 0.105),
        sz: rr(1.1, 3.0),
        ph: rnd() * TAU,
        sw: rr(0.004, 0.016),
        a: rr(0.22, 0.72),
      });
    }

    // 背景星与闪烁
    bgStars = [];
    for (let i = 0; i < 240; i++) {
      bgStars.push({ x: rnd(), y: Math.pow(rnd(), 1.25) * 0.94, r: 0.35 + rnd() * 1.15, a: rr(0.10, 0.50) });
    }
    twinkles = [];
    for (let i = 0; i < 26; i++) {
      twinkles.push({ x: rnd(), y: Math.pow(rnd(), 1.3) * 0.9, ph: rnd() * TAU, fq: rr(0.5, 1.6), sz: rr(1.6, 3.4) });
    }

    flash.list.length = 0;
  }

  /* ───────────────────────────── 尺寸与背景 ───────────────────────────── */
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    CX = W / 2;
    CY = H * 0.45;
    K = Math.min(H * 0.58, W * 0.86);

    // 拖尾层：低画质时降到 0.72，省一半填充率，且模糊对上辉光反而更好看
    const TS = quality.level >= 1 ? 1 : 0.72;
    trailCv.width = Math.max(8, Math.round(W * DPR * TS));
    trailCv.height = Math.max(8, Math.round(H * DPR * TS));
    tctx.setTransform(DPR * TS, 0, 0, DPR * TS, 0, 0);
    tctx.clearRect(0, 0, W, H);

    bloomA.width = Math.max(8, Math.round((W * DPR) / 4));
    bloomA.height = Math.max(8, Math.round((H * DPR) / 4));
    bloomB.width = Math.max(6, Math.round((W * DPR) / 12));
    bloomB.height = Math.max(6, Math.round((H * DPR) / 12));

    buildBackground();

    vignette = ctx.createRadialGradient(CX, CY * 0.92, Math.min(W, H) * 0.24, CX, CY * 0.92, Math.max(W, H) * 0.80);
    vignette.addColorStop(0.00, 'rgba(0,0,0,0)');
    vignette.addColorStop(0.55, 'rgba(0,0,0,0.16)');
    vignette.addColorStop(1.00, 'rgba(0,0,0,0.74)');
  }

  function buildBackground() {
    bgCanvas.width = Math.round(W * DPR);
    bgCanvas.height = Math.round(H * DPR);
    bgCtx.setTransform(DPR, 0, 0, DPR, 0, 0);

    const g = bgCtx;
    g.fillStyle = '#03060a';
    g.fillRect(0, 0, W, H);

    // 夜空底色：冷蓝偏青，向下方沉为墨绿
    const sky = g.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0.00, '#050b12');
    sky.addColorStop(0.42, '#061018');
    sky.addColorStop(0.72, '#04120f');
    sky.addColorStop(1.00, '#02080a');
    g.fillStyle = sky;
    g.fillRect(0, 0, W, H);

    // 极光晕：三团极低透明度的色云
    const clouds = [
      { x: 0.50, y: 0.30, r: 0.62, c: '40,190,140', a: 0.115 },
      { x: 0.22, y: 0.58, r: 0.46, c: '30,120,170', a: 0.075 },
      { x: 0.80, y: 0.44, r: 0.42, c: '120,190,255', a: 0.055 },
    ];
    for (const c of clouds) {
      const rad = Math.max(W, H) * c.r;
      const grd = g.createRadialGradient(W * c.x, H * c.y, 0, W * c.x, H * c.y, rad);
      grd.addColorStop(0, 'rgba(' + c.c + ',' + c.a + ')');
      grd.addColorStop(0.55, 'rgba(' + c.c + ',' + (c.a * 0.32).toFixed(3) + ')');
      grd.addColorStop(1, 'rgba(' + c.c + ',0)');
      g.fillStyle = grd;
      g.fillRect(0, 0, W, H);
    }

    // 静态星
    for (const s of bgStars) {
      g.fillStyle = 'rgba(226,244,255,' + s.a.toFixed(3) + ')';
      g.beginPath();
      g.arc(s.x * W, s.y * H, s.r, 0, TAU);
      g.fill();
    }
  }

  /* ───────────────────────────── 地面辉光 ───────────────────────────── */
  function drawGround() {
    const gy = CY + 0.55 * K;
    const gr = 0.62 * K;

    // 冷绿光池
    ctx.save();
    ctx.translate(CX, gy);
    ctx.scale(1.75, 0.40);
    const grd = ctx.createRadialGradient(0, 0, 0, 0, 0, gr);
    grd.addColorStop(0.00, 'rgba(78,214,152,0.22)');
    grd.addColorStop(0.32, 'rgba(38,150,120,0.105)');
    grd.addColorStop(0.68, 'rgba(18,88,96,0.035)');
    grd.addColorStop(1.00, 'rgba(0,0,0,0)');
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.arc(0, 0, gr, 0, TAU);
    ctx.fill();
    ctx.restore();

    // 灯串落在地面的一层暖色反光
    ctx.save();
    ctx.translate(CX, gy);
    ctx.scale(1.30, 0.30);
    const warm = ctx.createRadialGradient(0, 0, 0, 0, 0, gr * 0.6);
    warm.addColorStop(0.00, 'rgba(255,198,118,0.12)');
    warm.addColorStop(0.45, 'rgba(255,180,90,0.045)');
    warm.addColorStop(1.00, 'rgba(255,170,80,0)');
    ctx.fillStyle = warm;
    ctx.beginPath();
    ctx.arc(0, 0, gr * 0.6, 0, TAU);
    ctx.fill();
    ctx.restore();
  }

  /* ───────────────────────────── 相机（自由视角） ───────────────────────────── */
  function updateCamera(dt) {
    // 松手后的惯性 + 空闲后缓慢接回自转
    state.idle += dt;
    const idleW = clamp((state.idle - CFG.idleSpin) / 2.2, 0, 1);
    state.spinW += (idleW - state.spinW) * Math.min(1, dt * 1.8);

    if (dragging) {
      // 拖动中的位移由 pointermove 直接写入，这里只做限幅
      state.vyaw = clamp(state.vyaw, -9, 9);
      state.vpitch = clamp(state.vpitch, -9, 9);
    } else {
      state.yaw += state.vyaw * dt;
      state.pitch += state.vpitch * dt;
      state.vyaw *= Math.exp(-5.5 * dt);
      state.vpitch *= Math.exp(-5.5 * dt);
      if (Math.abs(state.vyaw) < 1e-4) state.vyaw = 0;
      if (Math.abs(state.vpitch) < 1e-4) state.vpitch = 0;
    }

    // 空闲时才接回自转
    state.yaw += CFG.spin * dt * state.spinW;
    state.pitch = clamp(state.pitch, CFG.pitchMin, CFG.pitchMax);

    state.dist += (state.distTarget - state.dist) * Math.min(1, dt * 6.5);

    cyaw = Math.cos(state.yaw); syaw = Math.sin(state.yaw);
    cpitch = Math.cos(state.pitch); spitch = Math.sin(state.pitch);
  }

  /* ───────────────────────────── 闪烁 ───────────────────────────── */
  function updateFlash(dt) {
    pointer.idle += dt;

    // 手指按住 = 停止闪烁；松开后等一会儿再缓缓接回来
    if (pointer.down) {
      flash.allow = false;
      flash.sinceUp = 0;
    } else {
      flash.sinceUp += dt;
      if (!flash.on) flash.allow = false;
      else flash.allow = flash.sinceUp > CFG.flashDelay;
    }
    const ramp = flash.allow ? clamp((flash.sinceUp - CFG.flashDelay) / CFG.flashRamp, 0, 1) : 0;
    if (state.elapsed < 2.2) { flash.budget = 0; return; }

    if (ramp > 0) {
      flash.budget += CFG.flashRate * ramp * dt;
      while (flash.budget >= 1) {
        flash.budget -= 1;
        spawnFlash();
      }
    } else {
      flash.budget = 0;
    }
  }

  function spawnFlash(dur) {
    if (!lightPool.length) return;
    let p;
    if (rnd() < 0.66) p = lightPool[(rnd() * lightPool.length) | 0];
    else p = particles[(rnd() * particles.length) | 0];
    if (!p || p.fl > 0.35) return;

    const light = p.light;
    p.fl = 1;
    p.flDur = dur || (light ? rr(0.115, 0.185) : rr(0.085, 0.135));
    p.fls = 1 / p.flDur;
    p.flPow = light ? 1 : 0.52;
    flash.total++;
  }

  /* ───────────────────────────── 树体（画进拖尾层） ───────────────────────────── */
  function drawTree(dt) {
    const P = particles;
    const t = state.t;
    const CAM = state.dist;
    const kScale = K / 520;
    const el = state.elapsed;
    const spring = 34, damp = 7.2;
    const step = quality.level === 0 ? 2 : 1;
    const ptrOn = pointer.active;

    // 拖尾：把上一帧的画面按比例抹淡（与帧率无关）
    const fade = clamp(1 - Math.pow(1 - CFG.trailBase, dt * 60), 0, 0.92);
    tctx.globalCompositeOperation = 'destination-out';
    tctx.fillStyle = 'rgba(0,0,0,' + fade.toFixed(3) + ')';
    tctx.fillRect(0, 0, W, H);
    tctx.globalCompositeOperation = 'lighter';

    const pushR = CFG.pushR;
    flash.live = 0;

    for (let i = 0; i < P.length; i += step) {
      const p = P[i];

      // 闪烁衰减放在最前：被视锥裁掉的粒子也要正常冷却
      if (p.fl > 0) {
        p.fl -= p.fls * dt;
        if (p.fl < 0) p.fl = 0;
      }

      const sw = Math.sin(t * p.fq + p.ph);
      const ang = p.a0 + sw * p.wob + t * p.spd;
      const rad = p.r * (1 + 0.016 * sw);
      const ca = Math.cos(ang), sa = Math.sin(ang);

      let X0 = ca * rad;
      let Z0 = sa * rad;
      let Y0 = p.y0;

      // 点击绽开后的阻尼弹簧回位（世界空间）
      if (p.ox !== 0 || p.oy !== 0 || p.oz !== 0 || p.vx !== 0 || p.vy !== 0 || p.vz !== 0) {
        p.vx += (-spring * p.ox - damp * p.vx) * dt;
        p.vy += (-spring * p.oy - damp * p.vy) * dt;
        p.vz += (-spring * p.oz - damp * p.vz) * dt;
        p.ox += p.vx * dt;
        p.oy += p.vy * dt;
        p.oz += p.vz * dt;
        X0 += p.ox; Y0 += p.oy; Z0 += p.oz;
      }

      // 汇聚入场的缓动
      let aMul = 1;
      if (el < p.delay + CFG.revealDur) {
        const k = clamp((el - p.delay) / CFG.revealDur, 0, 1);
        if (k <= 0) { p.vis = false; continue; }
        const e = easeOut(k);
        X0 = lerp(p.sx0, X0, e);
        Y0 = lerp(p.sy0, Y0, e);
        Z0 = lerp(p.sz0, Z0, e);
        aMul = e;
      }

      // yaw → pitch → 透视
      const X = X0 * cyaw + Z0 * syaw;
      const Z = -X0 * syaw + Z0 * cyaw;
      const Y2 = Y0 * cpitch + Z * spitch;
      const Z2 = -Y0 * spitch + Z * cpitch;

      const d = CAM - Z2;
      if (d < 0.45) { p.vis = false; continue; }
      const s = CAM / d;

      let px = CX + X * K * s;
      let py = CY - Y2 * K * s;

      // ── 指尖避让：屏幕空间里的排斥 + 自带弹簧回位 ──
      if (ptrOn || p.moving) {
        if (ptrOn) {
          const dx = px - pointer.x;
          const dy = py - pointer.y;
          const R = pushR * p.pushR;
          const d2 = dx * dx + dy * dy;
          if (d2 < R * R && d2 > 0.5) {
            const dist = Math.sqrt(d2);
            const f = 1 - dist / R;
            const imp = f * f * CFG.pushForce * p.stroke / p.mass;
            const ux = dx / dist, uy = dy / dist;
            // 切向分量：被拨开时带一点绕行，像指尖搅过一团光
            p.fvx += (ux - uy * p.swirl) * imp * dt;
            p.fvy += (uy + ux * p.swirl) * imp * dt;
            p.moving = true;
          }
        }
        if (p.moving) {
          p.fvx += (-p.k * p.fpx - p.damp * p.fvx) * dt;
          p.fvy += (-p.k * p.fpy - p.damp * p.fvy) * dt;
          p.fpx += p.fvx * dt;
          p.fpy += p.fvy * dt;
          if (!ptrOn && Math.abs(p.fpx) < 0.05 && Math.abs(p.fpy) < 0.05 &&
              Math.abs(p.fvx) < 0.5 && Math.abs(p.fvy) < 0.5) {
            p.fpx = 0; p.fpy = 0; p.fvx = 0; p.fvy = 0;
            p.moving = false;
          }
        }
        px += p.fpx; py += p.fpy;
      }

      const depth = clamp((s - 0.72) / 0.62, 0, 1);
      const bokeh = 1 + 0.55 * (1 - depth);
      const sz = p.sz * kScale * s * bokeh;
      const twinkle = 0.66 + 0.34 * (sw * 0.5 + 0.5);
      let a = p.base * twinkle * (0.52 + 0.48 * depth) * aMul;

      if (p.type === 'orn') {
        const pulse = 0.55 + 0.45 * Math.pow(Math.sin(t * 1.3 + p.ph) * 0.5 + 0.5, 1.6);
        a *= 0.55 + 0.85 * pulse;
      }

      // 缓存投影结果（闪烁层要用）
      if (px < -80 || px > W + 80 || py < -80 || py > H + 80) { p.vis = false; continue; }
      if (a < 0.012 || sz < 0.4) { p.vis = false; continue; }

      const prevA = p.pa;
      p.pvx = px - p.px; p.pvy = py - p.py;
      p.px = px; p.py = py; p.psz = sz; p.pa = a; p.vis = true;

      tctx.globalAlpha = a > 1 ? 1 : a;
      tctx.drawImage(SPR[p.kind], px - sz * 0.5, py - sz * 0.5, sz, sz);

      // 灯比叶子"轻"：移动时留下更长的彗尾（叶子靠整层拖尾，灯额外补两段鬼影）
      if (p.light && prevA > 0.02) {
        const sp2 = p.pvx * p.pvx + p.pvy * p.pvy;
        if (sp2 > 1.6) {
          const sp = Math.sqrt(sp2);
          const tl = Math.min(30, sp * 1.25);
          const nx = p.pvx / sp, ny = p.pvy / sp;
          for (let q = 1; q <= 2; q++) {
            const fq2 = q * 0.5;
            tctx.globalAlpha = a * (0.30 / q);
            const gx = px - nx * tl * fq2, gy = py - ny * tl * fq2;
            tctx.drawImage(SPR[p.kind], gx - sz * 0.44, gy - sz * 0.44, sz * 0.88, sz * 0.88);
          }
        }
      }

      if (p.fl > 0) flash.list[flash.live++] = p;
    }
    flash.list.length = Math.max(flash.live, flash.list.length);
  }

  /* ───────────────────────────── 闪烁层（画在主画布，保持凌厉） ───────────────────────────── */
  function drawFlashes() {
    const L = flash.list;
    for (let i = 0; i < flash.live; i++) {
      const p = L[i];
      if (!p.vis || p.fl <= 0) continue;
      const e = Math.pow(p.fl, 1.7) * p.flPow;
      if (e < 0.02) continue;

      const px = p.px, py = p.py, sz = p.psz;

      // 外圈炫光：让它在泛光里"炸"一下
      const halo = sz * (2.2 + 4.6 * e);
      ctx.globalAlpha = Math.min(1, 0.42 * e);
      ctx.drawImage(SPR[p.kind], px - halo * 0.5, py - halo * 0.5, halo, halo);

      // 高亮核：白得刺眼，短促
      const core = sz * (1.05 + 1.75 * e);
      ctx.globalAlpha = Math.min(1, 0.92 * e);
      ctx.drawImage(SPR_HOT, px - core * 0.5, py - core * 0.5, core, core);
    }
  }

  /* ───────────────────────────── 花环灯（带彗尾） ───────────────────────────── */
  function drawGarland() {
    const t = state.t;
    const CAM = state.dist;
    const kScale = K / 520;
    const fade = clamp((state.elapsed - 1.6) / 1.2, 0, 1);
    if (fade <= 0) return;

    for (let i = 0; i < garland.length; i++) {
      const g = garland[i];

      let prevX = 0, prevY = 0;
      for (let q = 0; q < 3; q++) {
        const tt = t - q * 0.055;
        const u = (g.off + tt * g.speed) % 1;
        const y0 = CFG.baseY + u * CFG.treeH;
        const prof = Math.pow(1 - u, 0.92);
        let R = CFG.baseR * prof;
      R *= tierProfile(u);
        const ang = u * CFG.turns * TAU + 0.16;
        const X0 = Math.cos(ang) * R * 1.06;
        const Z0 = Math.sin(ang) * R * 1.06;

        const X = X0 * cyaw + Z0 * syaw;
        const Z = -X0 * syaw + Z0 * cyaw;
        const Y2 = y0 * cpitch + Z * spitch;
        const Z2 = -y0 * spitch + Z * cpitch;
        const d = CAM - Z2;
        if (d < 0.45) break;
        const s = CAM / d;
        const px = CX + X * K * s;
        const py = CY - Y2 * K * s;

        if (q === 0) {
          const pulse = 0.5 + 0.5 * Math.sin(t * 2.4 + g.ph * 3.1);
          const sz = g.sz * kScale * s * (0.75 + 0.35 * pulse);
          const a = (0.34 + 0.5 * pulse) * fade;

          ctx.globalAlpha = a;
          ctx.drawImage(SPR[g.kind], px - sz * 0.5, py - sz * 0.5, sz, sz);
          if (pulse > 0.82) {
            const halo = sz * 2.6;
            ctx.globalAlpha = a * 0.35;
            ctx.drawImage(SPR[g.kind], px - halo * 0.5, py - halo * 0.5, halo, halo);
          }
          g.px = px; g.py = py; g.szPix = sz; g.sPix = s;
          prevX = px; prevY = py;
        } else {
          // 彗尾：越往后越淡越小
          const k = 1 - q * 0.34;
          ctx.globalAlpha = 0.20 * k * fade;
          const tsz = g.szPix * (0.86 - q * 0.16);
          ctx.drawImage(SPR[g.kind], px - tsz * 0.5, py - tsz * 0.5, tsz, tsz);
        }
      }
    }
  }

  function drawSnow(front) {
    const CAM = state.dist;
    const kScale = K / 520;

    for (let i = 0; i < droplets.length; i++) {
      const f = droplets[i];
      const X0 = f.x + Math.sin(state.t * 0.6 + f.ph) * 0.02;
      const Y0 = f.y;
      const Z0 = f.z;

      const X = X0 * cyaw + Z0 * syaw;
      const Z = -X0 * syaw + Z0 * cyaw;
      const Y2 = Y0 * cpitch + Z * spitch;
      const Z2 = -Y0 * spitch + Z * cpitch;
      const isFront = Z2 > 0;
      if (isFront !== front) continue;

      const d = CAM - Z2;
      if (d < 0.4) continue;
      const s = CAM / d;
      const px = CX + X * K * s;
      const py = CY - Y2 * K * s;
      if (px < -20 || px > W + 20 || py < -20 || py > H + 20) continue;

      const depth = clamp((s - 0.7) / 0.65, 0, 1);
      const sz = f.sz * kScale * s * 1.5;
      ctx.globalAlpha = f.a * (0.35 + 0.65 * depth);
      ctx.drawImage(SPR.ice, px - sz * 0.5, py - sz * 0.5, sz, sz);
    }
  }

  function drawStar() {
    const CAM = state.dist;
    const y0 = CFG.baseY + CFG.treeH + 0.055;
    const Y2 = y0 * cpitch;
    const Z2 = -y0 * spitch;
    const s = CAM / (CAM - Z2);
    const px = CX;
    const py = CY - Y2 * K * s;

    const fade = clamp((state.elapsed - 1.15) / 1.3, 0, 1);
    if (fade <= 0) return;

    const t = state.t;
    const pulse = 0.86 + 0.14 * Math.sin(t * 1.55);
    const R = 0.078 * K * s * pulse;

    const halo = R * 9.0;
    ctx.globalAlpha = 0.22 * fade;
    ctx.drawImage(SPR.gold, px - halo * 0.5, py - halo * 0.5, halo, halo);
    const halo2 = R * 3.4;
    ctx.globalAlpha = 0.55 * fade;
    ctx.drawImage(SPR.white, px - halo2 * 0.5, py - halo2 * 0.5, halo2, halo2);

    // 十字星芒（缓慢旋绕）
    ctx.save();
    ctx.translate(px, py);
    ctx.rotate(t * 0.1);
    const rayLen = R * 6.8;
    for (let i = 0; i < 4; i++) {
      ctx.rotate(Math.PI / 2);
      const g = ctx.createLinearGradient(0, 0, rayLen, 0);
      g.addColorStop(0, 'rgba(255,252,232,0.26)');
      g.addColorStop(0.26, 'rgba(255,226,150,0.075)');
      g.addColorStop(1, 'rgba(255,200,110,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(0, -R * 0.13);
      ctx.lineTo(rayLen, 0);
      ctx.lineTo(0, R * 0.13);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();

    // 五角星实体
    ctx.globalAlpha = fade;
    const outer = R * 1.42, inner = outer * 0.40;
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const rad = i % 2 ? inner : outer;
      const a = -Math.PI / 2 + (i * Math.PI) / 5 + t * 0.05;
      const x = px + Math.cos(a) * rad;
      const y = py + Math.sin(a) * rad;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
    const fill = ctx.createRadialGradient(px, py, 0, px, py, outer);
    fill.addColorStop(0.00, 'rgba(255,255,250,1)');
    fill.addColorStop(0.35, 'rgba(255,240,190,0.92)');
    fill.addColorStop(0.72, 'rgba(255,200,110,0.42)');
    fill.addColorStop(1.00, 'rgba(255,180,80,0)');
    ctx.fillStyle = fill;
    ctx.fill();
  }

  function drawTwinkles() {
    for (const s of twinkles) {
      const v = 0.5 + 0.5 * Math.sin(state.t * s.fq + s.ph);
      const a = 0.10 + 0.55 * v * v;
      const sz = s.sz * (0.7 + 0.6 * v);
      ctx.globalAlpha = a;
      ctx.drawImage(SPR.white, s.x * W - sz, s.y * H - sz, sz * 2, sz * 2);
    }
  }

  /* ───────────────────────────── 循环 ───────────────────────────── */
  let last = performance.now();
  let fpsAcc = 0, fpsFrames = 0, fps = 60;

  let perfClock = 0, perfFrames = 0, gradeHold = 4;

  function render(dt) {
    updateCamera(dt);
    updateFlash(dt);

    // 雪的下落
    for (let i = 0; i < droplets.length; i++) {
      const f = droplets[i];
      f.y -= f.vy * dt;
      f.x += Math.sin(state.t * 0.5 + f.ph) * f.sw * dt * 6;
      if (f.y < -0.66) {
        f.y = 0.98 + rnd() * 0.1;
        f.x = rr(-1.05, 1.05);
        f.z = rr(-1.05, 1.05);
      }
    }

    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.drawImage(bgCanvas, 0, 0, W, H);

    ctx.globalCompositeOperation = 'lighter';
    drawTwinkles();
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    drawGround();

    ctx.globalCompositeOperation = 'lighter';
    drawSnow(false);

    // 树体：先画进拖尾层（内部自带抹淡），再整体叠回
    drawTree(dt);
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 1;
    ctx.drawImage(trailCv, 0, 0, W, H);

    drawFlashLayer();
    drawGarland();
    drawSnow(true);
    drawStar();

    // 两级泛光
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;

    bA.clearRect(0, 0, bloomA.width, bloomA.height);
    bA.drawImage(canvas, 0, 0, bloomA.width, bloomA.height);
    if (quality.level >= 2) {
      bB.clearRect(0, 0, bloomB.width, bloomB.height);
      bB.drawImage(canvas, 0, 0, bloomB.width, bloomB.height);
    }

    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.34;
    ctx.drawImage(bloomA, 0, 0, W, H);
    if (quality.level >= 2) {
      ctx.globalAlpha = 0.28;
      ctx.drawImage(bloomB, 0, 0, W, H);
    }

    // 暗角收束
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.fillStyle = vignette;
    ctx.fillRect(0, 0, W, H);
  }

  function drawFlashLayer() {
    ctx.globalCompositeOperation = 'lighter';
    drawFlashes();
  }

  function frame(now) {
    requestAnimationFrame(frame);

    let raw = (now - last) / 1000;
    last = now;
    if (!isFinite(raw) || raw < 0) raw = 0;
    raw = Math.min(raw, 1 / 20);

    state.elapsed += raw;
    const dt = raw * MOTION;
    state.t += dt;

    fpsAcc += raw; fpsFrames++;
    if (fpsAcc >= 0.5) { fps = fpsFrames / fpsAcc; fpsAcc = 0; fpsFrames = 0; }

    perfClock += raw; perfFrames++;
    gradeHold -= raw;
    if (perfClock >= 2) {
      const measured = perfFrames / perfClock;
      perfClock = 0; perfFrames = 0;
      if (!NO_GRADE && quality.level > 0 && state.elapsed > 4 && gradeHold <= 0 && measured < 38) {
        quality.level--;
        gradeHold = 4;
      }
    }

    render(dt);
  }

  /* ───────────────────────────── 交互 ───────────────────────────── */
  function burst() {
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      const dx = Math.cos(p.a0) * 0.7 + gauss() * 0.35;
      const dz = Math.sin(p.a0) * 0.7 + gauss() * 0.35;
      const dy = (p.y0 + 0.1) * 1.1 + gauss() * 0.3;
      const imp = rr(1.1, 2.6);
      p.vx += dx * imp;
      p.vy += dy * imp * 0.8;
      p.vz += dz * imp;
    }
  }

  let dragging = false;
  let dragX = 0, dragY = 0;
  let moved = 0;

  function pointAt(e) {
    pointer.x = e.clientX;
    pointer.y = e.clientY;
  }

  window.addEventListener('pointermove', (e) => {
    pointAt(e);
    pointer.active = true;
    pointer.idle = 0;
    state.idle = 0;

    if (dragging) {
      const dx = e.clientX - dragX;
      const dy = e.clientY - dragY;
      dragX = e.clientX; dragY = e.clientY;
      moved += Math.abs(dx) + Math.abs(dy);

      state.yaw += dx * CFG.dragYaw;
      state.pitch = clamp(state.pitch + dy * CFG.dragPitch, CFG.pitchMin, CFG.pitchMax);
      state.vyaw = dx * CFG.dragYaw * 30;
      state.vpitch = dy * CFG.dragPitch * 30;
    }
  }, { passive: true });

  window.addEventListener('pointerdown', (e) => {
    pointAt(e);
    pointer.down = true;
    pointer.active = true;
    pointer.idle = 0;
    state.idle = 0;
    state.spinW = 0;
    dragging = true;
    dragX = e.clientX; dragY = e.clientY;
    moved = 0;
    if (e.target === canvas) canvas.classList.add('dragging');
    if (canvas.setPointerCapture && e.pointerId !== undefined) {
      try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
    }
  });

  function endPointer(e) {
    if (e) pointAt(e);
    pointer.down = false;
    pointer.active = false;
    pointer.idle = 0;
    dragging = false;
    canvas.classList.remove('dragging');
  }

  window.addEventListener('pointerup', endPointer);
  window.addEventListener('pointercancel', endPointer);
  window.addEventListener('pointerleave', (e) => {
    pointer.active = false;
    if (!pointer.down) pointer.idle = 0;
  });

  // 滚轮缩放（自由视角的"远近"）
  window.addEventListener('wheel', (e) => {
    if (e.target !== canvas) return;
    e.preventDefault();
    state.distTarget = clamp(state.distTarget + Math.sign(e.deltaY) * 0.14, CFG.camMin, CFG.camMax);
    state.idle = 0;
  }, { passive: false });

  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') { e.preventDefault(); burst(); }
    if (e.key === 'f' || e.key === 'F') flash.on = !flash.on;
  });

  // 双击绽开（单击留给"触碰驱散"，避免两种反馈打架）
  canvas.addEventListener('dblclick', (e) => { e.preventDefault(); burst(); });

  let resizeTimer = 0;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(resize, 120);
  });

  window.addEventListener('orientationchange', () => setTimeout(resize, 220));

  /* ───────────────────────────── 启动 ───────────────────────────── */
  NO_GRADE = new URLSearchParams(location.search).has('hq');

  buildTree();
  resize();
  requestAnimationFrame((t) => { last = t; frame(t); });

  window.__tree = {
    get fps() { return fps; },
    get quality() { return quality.level; },
    get count() { return particles.length; },
    state,
    cam: state,
    pointer,
    flash,
    burst,
    setFlash(v) { flash.on = !!v; },
    // 质检用：把时间推进到 t 并立刻渲染一帧
    seek(t) {
      state.elapsed = Math.max(state.elapsed, t + CFG.revealDur);
      state.t = t;
      state.yaw = t * CFG.spin;
      state.idle = 99;
      tctx.clearRect(0, 0, W, H);
      updateCamera(1 / 60);
      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        p.fpx = 0; p.fpy = 0; p.fvx = 0; p.fvy = 0; p.moving = false; p.fl = 0;
      }
      flash.live = 0;
      render(1 / 60);
      render(1 / 60);
    },
    // 质检修：把指针放到某点并当作按住，检查驱散与停闪
    touch(x, y, down) {
      pointer.x = x; pointer.y = y;
      pointer.active = true;
      pointer.down = !!down;
      pointer.idle = 0;
      state.idle = 0;
    },
    release() { pointer.down = false; pointer.active = false; pointer.idle = 0; },
    // 质检修：总位移量，用来断言"是否回到原位"
    offsetSum() {
      let s = 0;
      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        s += Math.abs(p.fpx) + Math.abs(p.fpy);
      }
      return s;
    },
    // 质检修：以固定步长推进若干帧（不受无头浏览器低帧率影响）
    step(dtFixed, n) {
      const d = dtFixed || 1 / 60;
      for (let i = 0; i < n; i++) {
        state.elapsed += d;
        state.t += d;
        render(d);
      }
    },
    // 质检修：批量触发闪烁（dur 用于把闪烁定格在长曝光上，方便截图核对）
    forceFlash(n, dur) {
      for (let i = 0; i < n; i++) spawnFlash(dur);
      return flash.total;
    },
  };
})();
</script>
</body>
</html>
